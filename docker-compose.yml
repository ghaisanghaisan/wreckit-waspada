services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "timezone=UTC"]
    networks:
      - waspada-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - waspada-net

  waspada-engine:
    build:
      context: .
      dockerfile: ./rssengine/Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - waspada-net
    volumes:
      - hf-cache:/cache/huggingface
  adminer:
      image: adminer:latest
      restart: always
      ports:
        - "8080:8080"
      depends_on:
        - database
      networks:
        - waspada-net


networks:
  waspada-net:
    driver: bridge

volumes:
  db-data:
  hf-cache:
