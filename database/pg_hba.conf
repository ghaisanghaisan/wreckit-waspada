# database/pg_hba.conf  -- replace <DOCKER_CIDR> with your docker network subnet (e.g. 172.18.0.0/16)

# Allow local unix-socket connections (inside container)
local   all             all                                     peer

# Allow localhost via TCP (loopback)
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5

# Allow connections from the Docker network and host (password auth)
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5

# Optional: deny rest by default (the file is read top-to-bottom)